  font-size: 0.875rem;
  line-height: 1.25rem;
}
.font-bold{
  font-weight: 700;
}
.font-extrabold{
  font-weight: 800;
}
.font-normal{
  font-weight: 400;
}
.font-semibold{
  font-weight: 600;
}
.normal-case{
  text-transform: none;
}
.leading-none{
  line-height: 1;
}
.leading-relaxed{
  line-height: 1.625;
}
.tracking-\[0\.14em\]{
  letter-spacing: 0.14em;
}
.tracking-\[0\.18em\]{
  letter-spacing: 0.18em;
}
.tracking-\[0\.2em\]{
  letter-spacing: 0.2em;
}
.tracking-normal{
  letter-spacing: 0em;
}
.tracking-wider{
  letter-spacing: 0.05em;
}
.tracking-widest{
  letter-spacing: 0.1em;
}
.text-\[var\(--ink\)\]{
  color: var(--ink);
}
.filter{

.transition-colors{

:root {
  --bg: #e8ece7;
  --surface: #f4f6f1;
  --surface-2: #dde3da;
  --ink: #131a16;
  --muted: #5b665e;
  --line: #c3cec2;
  --accent: #0d7a6a;
  --accent-soft: #bfe6dc;
  --miss: #c22f2f;
  --fail: #c96a12;
  --rdy: #0d7a6a;
  --cell-off: #dfe5dc;
  --safe-area-inset-top: 0px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #070a09;
    --surface: #0d1210;
    --surface-2: #131a17;
    --ink: #d7e4da;
    --muted: #7d8f83;
    --line: #223028;
    --accent: #2dd4a8;
    --accent-soft: #123c31;
    --miss: #ff5a4e;
    --fail: #ff9a3d;
    --rdy: #2dd4a8;
    --cell-off: #101613;
  }
}
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
* {
  -webkit-tap-highlight-color: transparent;
}
::-moz-selection {
  background: var(--accent);
  color: var(--bg);
}
::selection {
  background: var(--accent);
  color: var(--bg);
}
textarea, input, select {
  outline: none;
}
textarea:focus, input:focus, select:focus {
  border-color: var(--accent) !important;
  box-shadow: 0 0 0 1px var(--accent);
}
.log-scroll::-webkit-scrollbar, .thin-scroll::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
.log-scroll::-webkit-scrollbar-thumb, .thin-scroll::-webkit-scrollbar-thumb {
  background: var(--line);
}
.disabled\:opacity-40:disabled{
  opacity: 0.4;
}
@media (min-width: 640px){
  .sm\:p-4{
    padding: 1rem;
  }
  .sm\:px-5{
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .sm\:text-\[10px\]{
    font-size: 10px;
  }
  .sm\:text-\[8px\]{
    font-size: 8px;
  }
}
@media (min-width: 768px){
  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (min-width: 1024px){
  .lg\:col-span-2{
    grid-column: span 2 / span 2;
  }
  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
